<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lagerraum</title>
<style>
:root{--bg:#0f1410;--card:#182019;--card2:#202a21;--line:#344136;--text:#f4f7f4;--muted:#aab5ac;--accent:#8eb47f;--warn:#e8b85f;--bad:#e17878}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:18px 14px 14px;background:#0f1410f2;border-bottom:1px solid var(--line);z-index:4}
header h1{font-size:20px;margin:0;flex:1}button,input,select,textarea{font:inherit}
button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:13px;padding:12px}
main{padding:14px;max-width:760px;margin:auto}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{text-align:left;min-height:110px}.tile.big{grid-column:1/-1;background:#223126}.tile b{display:block;font-size:18px;margin-top:8px}.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}.input,.select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;margin:5px 0 10px}
.primary{background:var(--accent);color:#102012;font-weight:800}.danger{background:#432326}.list{display:grid;gap:9px}.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2b352c;color:var(--muted);font-size:12px;margin:4px 4px 0 0}.warn{background:#4a3a1b;color:#ffd987}.bad{background:#462225;color:#ffb1b1}
.hidden{display:none}.topbtn{width:44px;height:44px;padding:0}.sectionTitle{font-size:17px;margin:18px 0 9px}.qrbox{text-align:center}.qrbox img{width:min(72vw,320px);background:white;padding:12px;border-radius:16px}.scanHero{padding:18px;text-align:center}.scanHero button{width:100%;font-size:18px;padding:18px}
</style>
</head>
<body>
<header><button id="back" class="topbtn hidden">←</button><button id="home" class="topbtn hidden">⌂</button><h1 id="title">Lagerraum</h1><button id="settings" class="topbtn">⚙</button></header>
<main id="app"></main>
<script>
const KEY='lagerraum01';
const defaults={items:[],batches:[],shopping:[],locations:[{id:'home',name:'Haus',parent:null},{id:'kitchen',name:'Küche',parent:'home'},{id:'fridge',name:'Kühlschrank',parent:'kitchen'},{id:'cellar',name:'Keller',parent:'home'}],actions:[],settings:{warnDays:3,notificationsEnabled:false,notificationTime:'09:00'}};
let db=load(),route='home',stack=[],pendingQr='',activeScanLocation=null,assignLocationId=null,currentItemId=null,currentBatchId=null,currentQrData=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return structuredClone(defaults)}}
function syncNotifications(){if(window.Android&&Android.updateNotifications){const s=db.settings||{};Android.updateNotifications(!!s.notificationsEnabled,s.notificationTime||'09:00',JSON.stringify(db))}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));syncNotifications()}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function viewState(){return{route,itemId:currentItemId,batchId:currentBatchId,qr:currentQrData}}
function restoreView(s){route=s&&s.route||'home';currentItemId=s&&s.itemId||null;currentBatchId=s&&s.batchId||null;currentQrData=s&&s.qr||null;render()}
function navigate(r,data={}){stack.push(viewState());route=r;currentItemId=data.itemId||null;currentBatchId=data.batchId||null;currentQrData=data.qr||null;render()}
function replaceView(r,data={}){route=r;currentItemId=data.itemId||null;currentBatchId=data.batchId||null;currentQrData=data.qr||null;render()}
function go(r){if(route!==r)navigate(r)}
function home(){stack=[];route='home';currentItemId=currentBatchId=currentQrData=null;render()}
function back(){restoreView(stack.pop()||{route:'home'})}
function title(t){$('#title').textContent=t;$('#back').classList.toggle('hidden',route==='home');$('#home').classList.toggle('hidden',route==='home')}
$('#back').onclick=back;$('#home').onclick=home;$('#settings').onclick=()=>go('settings');
function total(id){return db.batches.filter(b=>b.itemId===id).reduce((n,b)=>n+Number(b.qty||0),0)}
function locName(id){let l=db.locations.find(x=>x.id===id);if(!l)return 'Ohne Lagerort';let a=[l.name];while(l.parent){l=db.locations.find(x=>x.id===l.parent);if(!l)break;a.unshift(l.name)}return a.join(' › ')}
function dayDiff(d){if(!d)return 9999;return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}
function dateDE(d){if(!d)return '';const p=String(d).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:String(d)}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDaysISO(date,days){if(!date||!Number(days))return '';const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+Number(days));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function earliest(id){return db.batches.filter(b=>b.itemId===id&&b.qty>0&&(b.useBy||b.bestBefore||b.openUntil)).sort((a,b)=>(a.openUntil||a.useBy||a.bestBefore).localeCompare(b.openUntil||b.useBy||b.bestBefore))[0]}
function warnCounts(){let soon=0,expired=0,low=0,opened=0;for(const i of db.items){const e=earliest(i.id),d=e?dayDiff(e.openUntil||e.useBy||e.bestBefore):9999;if(d<0)expired++;else if(d<=db.settings.warnDays)soon++;if(total(i.id)<Number(i.min||0))low++;if(db.batches.some(b=>b.itemId===i.id&&b.opened&&b.qty>0))opened++}return{soon,expired,low,opened}}
function itemHtml(i){const e=earliest(i.id),d=e?dayDiff(e.openUntil||e.useBy||e.bestBefore):9999;return '<button class="item" data-item="'+i.id+'"><b>'+esc(i.name)+'</b><div class="muted">'+total(i.id)+' '+esc(i.unit||'Stk.')+' · '+esc(i.category||'Ohne Kategorie')+'</div>'+(d<0?'<span class="badge bad">abgelaufen</span>':d<=db.settings.warnDays?'<span class="badge warn">bald fällig</span>':'')+(total(i.id)<Number(i.min||0)?'<span class="badge warn">Mindestbestand</span>':'')+'</button>'}
function render(){({home:renderHome,stock:renderStock,add:renderAdd,shopping:renderShopping,dashboard:renderDashboard,inventory:renderInventory,history:renderHistory,scan:renderScan,settings:renderSettings,locations:renderLocations,item:renderItem,itemedit:renderItemEdit,batch:renderBatch,editbatch:renderEditBatch,qr:renderQr}[route]||renderHome)()}
function renderHome(){title('Lagerraum');const w=warnCounts();$('#app').innerHTML='<div class="hero"><h2 style="margin:0">Vorrat im Blick</h2><div class="muted">'+db.items.length+' Artikel gespeichert</div><div class="row" style="margin-top:12px"><div class="card" style="margin:0;text-align:center"><b>'+w.soon+'</b><div class="muted">bald ablaufend</div></div><div class="card" style="margin:0;text-align:center"><b>'+w.low+'</b><div class="muted">Mindestbestand</div></div></div></div><div class="grid"><button class="tile" data-go="stock">🧺<b>Lager</b><span class="muted">Bestände & Chargen</span></button><button class="tile" data-go="add">＋<b>Hinzufügen</b><span class="muted">Artikel einlagern</span></button><button class="tile" data-go="shopping">🛒<b>Einkaufsliste</b><span class="muted">Einkäufe planen</span></button><button class="tile" data-go="dashboard">📊<b>Übersicht</b><span class="muted">Warnungen</span></button><button class="tile big" data-go="scan">▣<b>Scannen</b><span class="muted">QR-Code eingeben oder zuordnen</span></button></div><div class="row" style="margin-top:10px"><button data-go="inventory">✓ Inventur</button><button data-go="history">🕘 Verlauf</button><button data-go="settings">⚙ Einstellungen</button></div>';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function renderStock(){title('Lager');$('#app').innerHTML='<input id="q" class="input" placeholder="Suchen…"><div id="list" class="list"></div>';const draw=()=>{const q=$('#q').value.toLowerCase();const a=db.items.filter(i=>(i.name+' '+(i.brand||'')+' '+(i.category||'')).toLowerCase().includes(q));$('#list').innerHTML=a.map(itemHtml).join('')||'<div class="card muted">Noch keine Artikel vorhanden.</div>';document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openItem(b.dataset.item))};$('#q').oninput=draw;draw()}
function openItem(id){navigate('item',{itemId:id})}
function renderItem(){const id=currentItemId,i=db.items.find(x=>x.id===id),allBs=db.batches.filter(b=>b.itemId===id&&b.qty>0);if(!i){back();return;}title(i.name);const locs=[...new Set(allBs.map(b=>b.locationId).filter(Boolean))].sort((a,b)=>locName(a).localeCompare(locName(b)));$('#app').innerHTML='<div class="card"><h2>'+esc(i.name)+'</h2><div class="muted">'+esc(i.brand||'')+' · '+esc(i.category||'')+'</div><p>Gesamtbestand: <b>'+total(id)+' '+esc(i.unit||'Stk.')+'</b></p><div class="muted">Mindestbestand: '+Number(i.min||0)+' '+esc(i.unit||'Stk.')+'</div><div class="row" style="margin-top:10px"><button class="primary" id="in">＋ Einlagern</button><button id="out">− Entnehmen</button></div><div class="row" style="margin-top:8px"><button id="edititem">⚙ Artikel bearbeiten</button><button id="showqr">▣ QR-Code</button></div></div><h3 class="sectionTitle">Chargen</h3><div class="card"><div class="row"><label>Standort<select id="batchLocFilter" class="select"><option value="">Alle Standorte</option>'+locs.map(l=>'<option value="'+esc(l)+'">'+esc(locName(l))+'</option>').join('')+'</select></label><label>MHD / Datum<select id="batchDateFilter" class="select"><option value="">Alle</option><option value="expired">Abgelaufen</option><option value="soon">Bald fällig</option><option value="later">Später</option><option value="none">Ohne Datum</option></select></label></div><div class="muted">Sortierung: zuerst ablaufende Charge</div></div><div id="batchList" class="list"></div>';const drawBatches=()=>{const loc=$('#batchLocFilter').value,dateFilter=$('#batchDateFilter').value;let bs=allBs.slice().sort((a,b)=>{if(!!a.opened!==!!b.opened)return a.opened?-1:1;return batchExpiryKey(a).localeCompare(batchExpiryKey(b))});if(loc)bs=bs.filter(b=>b.locationId===loc);if(dateFilter)bs=bs.filter(b=>{const d=b.openUntil||b.useBy||b.bestBefore;if(dateFilter==='none')return !d;if(!d)return false;const diff=dayDiff(d);if(dateFilter==='expired')return diff<0;if(dateFilter==='soon')return diff>=0&&diff<=Number(db.settings.warnDays||0);if(dateFilter==='later')return diff>Number(db.settings.warnDays||0);return true});$('#batchList').innerHTML=bs.length?bs.map(b=>'<div class="card"><b>'+b.qty+' '+esc(i.unit||'Stk.')+'</b><div class="muted">'+esc(locName(b.locationId))+'</div><div class="muted">'+(b.opened?('Geöffnet'+(b.openedAt?' am '+dateDE(b.openedAt):'')+(b.openUntil?' · verbrauchen bis '+dateDE(b.openUntil):'')):(b.useBy?'Verbrauch: '+dateDE(b.useBy):b.bestBefore?'MHD: '+dateDE(b.bestBefore):'Ohne Datum'))+'</div><div class="row" style="margin-top:8px">'+(!b.opened?'<button class="openbatch" data-openbatch="'+b.id+'">🔓 Öffnen</button>':'')+'<button class="editbatch" data-batch="'+b.id+'">✎ Bearbeiten</button></div></div>').join(''):'<div class="card muted">Keine passenden Chargen.</div>';document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>openEditBatch(b.dataset.batch,id));document.querySelectorAll('[data-openbatch]').forEach(b=>b.onclick=()=>markBatchOpened(b.dataset.openbatch,id))};$('#batchLocFilter').onchange=drawBatches;$('#batchDateFilter').onchange=drawBatches;$('#in').onclick=()=>openBatch(i.id);$('#out').onclick=()=>removeOne(i);$('#edititem').onclick=()=>openItemEdit(i.id);$('#showqr').onclick=()=>openQr('ITEM',i.id,i.name);drawBatches()}
function markBatchOpened(batchId,itemId){const b=db.batches.find(x=>x.id===batchId),i=db.items.find(x=>x.id===itemId);if(!b||!i)return;if(!confirm('1 '+(i.unit||'Stk.')+' von „'+i.name+'“ als geöffnet markieren?'))return;const openedAt=todayISO(),openUntil=Number(i.openDays||0)>0?addDaysISO(openedAt,i.openDays):'';if(Number(b.qty)>1){b.qty=Number(b.qty)-1;db.batches.push({id:uid('batch'),itemId:b.itemId,qty:1,locationId:b.locationId,bestBefore:b.bestBefore||'',useBy:b.useBy||'',opened:true,openedAt,openUntil})}else{b.opened=true;b.openedAt=openedAt;b.openUntil=openUntil}db.actions.unshift({at:new Date().toISOString(),type:'Geöffnet',name:i.name});save();renderItem()}
function openItemEdit(id){navigate('itemedit',{itemId:id})}
function renderItemEdit(){const id=currentItemId,i=db.items.find(x=>x.id===id);if(!i){back();return;}const others=db.items.filter(x=>x.id!==id);title('Artikel bearbeiten');$('#app').innerHTML='<form id="eif" class="card"><label>Name<input class="input" name="name" required value="'+esc(i.name)+'"></label><label>Marke<input class="input" name="brand" value="'+esc(i.brand||'')+'"></label><label>Kategorie<input class="input" name="cat" value="'+esc(i.category||'')+'"></label><div class="row"><label>Einheit<select class="select" name="unit">'+['Stk.','Packung','Dose','Glas','g','kg','ml','l'].map(u=>'<option'+(u===(i.unit||'Stk.')?' selected':'')+'>'+u+'</option>').join('')+'</select></label><label>Mindestbestand<input class="input" name="min" type="number" min="0" step="0.01" value="'+Number(i.min||0)+'"></label></div><label>Nach Öffnung haltbar (Tage, optional)<input class="input" name="openDays" type="number" min="0" step="1" value="'+Number(i.openDays||0)+'"></label><label>Externer QR-/Barcode<input class="input" name="qr" value="'+esc(i.qr||'')+'"></label><button class="primary" style="width:100%">Änderungen speichern</button><button type="button" id="cancelItemEdit" style="width:100%;margin-top:8px">Abbrechen</button></form>'+(others.length?'<div class="card"><h3 style="margin-top:0">Doppelten Artikel zusammenführen</h3><div class="muted" style="margin-bottom:8px">Alle Chargen und verknüpften Einkaufseinträge dieses Artikels werden auf den gewählten Artikel übertragen.</div><select id="mergeTarget" class="select">'+others.map(x=>'<option value="'+x.id+'">'+esc(x.name)+(x.brand?' · '+esc(x.brand):'')+'</option>').join('')+'</select><button id="mergeItem" style="width:100%">Artikel zusammenführen</button></div>':'')+'<div class="card"><h3 style="margin-top:0">Artikel löschen</h3><div class="muted" style="margin-bottom:8px">Dabei werden auch alle Chargen und verknüpften Einkaufseinträge dieses Artikels gelöscht.</div><button id="deleteItem" class="danger" style="width:100%">Artikel endgültig löschen</button></div>';$('#eif').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);i.name=f.get('name').trim();i.brand=f.get('brand').trim();i.category=f.get('cat').trim();i.unit=f.get('unit');i.min=Number(f.get('min')||0);i.openDays=Number(f.get('openDays')||0);i.qr=f.get('qr').trim();save();back()};$('#cancelItemEdit').onclick=back;if($('#mergeItem'))$('#mergeItem').onclick=()=>mergeItem(id,$('#mergeTarget').value);$('#deleteItem').onclick=()=>deleteItem(id)}
function mergeItem(sourceId,targetId){if(!sourceId||!targetId||sourceId===targetId)return;const source=db.items.find(x=>x.id===sourceId),target=db.items.find(x=>x.id===targetId);if(!source||!target)return;if(!confirm('„'+source.name+'“ mit „'+target.name+'“ zusammenführen?\n\nAlle Chargen werden übernommen. Der Artikel „'+source.name+'“ wird danach entfernt.'))return;db.batches.forEach(b=>{if(b.itemId===sourceId)b.itemId=targetId});db.shopping.forEach(s=>{if(s.itemId===sourceId)s.itemId=targetId});if(!target.qr&&source.qr)target.qr=source.qr;const grouped={};db.shopping=db.shopping.filter(s=>{if(s.itemId!==targetId)return true;const k=(s.done?'1':'0')+'|'+targetId;if(!grouped[k]){grouped[k]=s;return true}grouped[k].qty=Number(grouped[k].qty||1)+Number(s.qty||1);return false});db.items=db.items.filter(x=>x.id!==sourceId);db.actions.unshift({at:new Date().toISOString(),type:'Artikel zusammengeführt',name:source.name+' → '+target.name});save();stack=[];route='stock';currentItemId=currentBatchId=currentQrData=null;render()}
function deleteItem(id){const i=db.items.find(x=>x.id===id);if(!i)return;const qty=total(id),charges=db.batches.filter(b=>b.itemId===id).length;if(!confirm('Artikel „'+i.name+'“ wirklich löschen?\n\nBestand: '+qty+' '+(i.unit||'Stk.')+'\nChargen: '+charges+'\n\nDieser Vorgang kann nicht rückgängig gemacht werden.'))return;db.items=db.items.filter(x=>x.id!==id);db.batches=db.batches.filter(b=>b.itemId!==id);db.shopping=db.shopping.filter(s=>s.itemId!==id);db.actions.unshift({at:new Date().toISOString(),type:'Artikel gelöscht',name:i.name});save();stack=[];route='stock';currentItemId=currentBatchId=currentQrData=null;render()}
function openEditBatch(batchId,itemId){navigate('editbatch',{batchId:batchId,itemId:itemId})}
function renderEditBatch(){const batchId=currentBatchId,itemId=currentItemId,b=db.batches.find(x=>x.id===batchId),i=db.items.find(x=>x.id===itemId);if(!b||!i){back();return;}title('Charge bearbeiten');$('#app').innerHTML='<div class="card"><h2>'+esc(i.name)+'</h2><div class="muted">'+b.qty+' '+esc(i.unit||'Stk.')+' · '+esc(locName(b.locationId))+'</div><form id="editbf" style="margin-top:14px"><label>Mindesthaltbarkeitsdatum<input class="input" name="mhd" type="date" value="'+esc(b.bestBefore||'')+'"></label><label>Verbrauchsdatum<input class="input" name="use" type="date" value="'+esc(b.useBy||'')+'"></label><label style="display:flex;gap:10px;align-items:center;margin:8px 0"><input id="openedCheck" type="checkbox" name="opened" '+(b.opened?'checked':'')+'> geöffnet</label><div id="openedFields" '+(b.opened?'':'class="hidden"')+'><label>Geöffnet am<input id="openedAt" class="input" name="openedAt" type="date" value="'+esc(b.openedAt||'')+'"></label><label>Nach Öffnung verbrauchen bis<input id="openUntil" class="input" name="openUntil" type="date" value="'+esc(b.openUntil||'')+'"></label>'+(Number(i.openDays||0)>0?'<div class="muted" style="margin-bottom:10px">Für diesen Artikel sind '+Number(i.openDays)+' Tage Haltbarkeit nach Öffnung hinterlegt.</div>':'')+'</div><button class="primary" style="width:100%;margin-top:8px">Änderungen speichern</button><button type="button" id="cancelEdit" style="width:100%;margin-top:8px">Abbrechen</button></form></div>';$('#editbf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);b.bestBefore=f.get('mhd')||'';b.useBy=f.get('use')||'';b.opened=f.get('opened')==='on';b.openedAt=b.opened?(f.get('openedAt')||todayISO()):'';b.openUntil=b.opened?(f.get('openUntil')||(Number(i.openDays||0)>0?addDaysISO(b.openedAt,i.openDays):'')):'';db.actions.unshift({at:new Date().toISOString(),type:'Charge geändert',name:i.name});save();back()};$('#openedCheck').onchange=e=>{const box=$('#openedFields');box.classList.toggle('hidden',!e.target.checked);if(e.target.checked&&!$('#openedAt').value){$('#openedAt').value=todayISO();if(Number(i.openDays||0)>0)$('#openUntil').value=addDaysISO($('#openedAt').value,i.openDays)}};$('#openedAt').onchange=e=>{if(Number(i.openDays||0)>0)$('#openUntil').value=addDaysISO(e.target.value,i.openDays)};$('#cancelEdit').onclick=back}
function optionsLoc(selected){return db.locations.map(l=>'<option value="'+l.id+'"'+(l.id===selected?' selected':'')+'>'+esc(locName(l.id))+'</option>').join('')}
function renderAdd(){title('Hinzufügen');$('#app').innerHTML='<form id="f" class="card"><label>Name<input class="input" name="name" required></label><label>Marke<input class="input" name="brand"></label><label>Kategorie<input class="input" name="cat"></label><div class="row"><label>Einheit<select class="select" name="unit"><option>Stk.</option><option>Packung</option><option>Dose</option><option>Glas</option><option>g</option><option>kg</option><option>ml</option><option>l</option></select></label><label>Mindestbestand<input class="input" name="min" type="number" min="0" value="0"></label></div><label>Nach Öffnung haltbar (Tage, optional)<input class="input" name="openDays" type="number" min="0" step="1" placeholder="z. B. 3"></label><label>Externer QR-Code (optional)<input class="input" name="qr" value="'+esc(pendingQr)+'"></label><button class="primary" style="width:100%">Artikel speichern</button></form>';$('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),i={id:uid('item'),name:f.get('name').trim(),brand:f.get('brand').trim(),category:f.get('cat').trim(),unit:f.get('unit'),min:Number(f.get('min')||0),openDays:Number(f.get('openDays')||0),qr:f.get('qr').trim()};pendingQr='';db.items.push(i);save();replaceView('batch',{itemId:i.id})}}
function openBatch(itemId){navigate('batch',{itemId:itemId})}
function renderBatch(){const i=db.items.find(x=>x.id===currentItemId);if(!i){back();return;}title('Einlagern');$('#app').innerHTML='<div class="card"><h2>'+esc(i.name)+'</h2><form id="bf"><label>Menge<input class="input" name="qty" type="number" min="0.01" step="0.01" value="1" required></label><label>Lagerort<select class="select" name="loc">'+optionsLoc(activeScanLocation)+'</select></label><label>MHD<input class="input" name="mhd" type="date"></label><label>Verbrauchsdatum<input class="input" name="use" type="date"></label><label style="display:flex;gap:10px;align-items:center;margin:8px 0"><input id="newOpened" type="checkbox" name="opened"> bereits geöffnet</label><div id="newOpenedFields" class="hidden"><label>Geöffnet am<input id="newOpenedAt" class="input" name="openedAt" type="date"></label>'+(Number(i.openDays||0)>0?'<div class="muted" style="margin-bottom:8px">Haltbarkeit nach Öffnung: '+Number(i.openDays)+' Tage</div>':'')+'</div><button class="primary" style="width:100%;margin-top:12px">Einlagern</button></form></div>';$('#newOpened').onchange=e=>{const box=$('#newOpenedFields');box.classList.toggle('hidden',!e.target.checked);if(e.target.checked&&!$('#newOpenedAt').value)$('#newOpenedAt').value=todayISO()};$('#bf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const opened=f.get('opened')==='on',openedAt=opened?(f.get('openedAt')||todayISO()):'';db.batches.push({id:uid('batch'),itemId:i.id,qty:Number(f.get('qty')),locationId:f.get('loc'),bestBefore:f.get('mhd'),useBy:f.get('use'),opened,openedAt,openUntil:opened&&Number(i.openDays||0)>0?addDaysISO(openedAt,i.openDays):''});if(total(i.id)>=Number(i.min||0))db.shopping=db.shopping.filter(x=>!(x.done&&x.itemId===i.id));db.actions.unshift({at:new Date().toISOString(),type:'Einlagern',name:i.name});save();home()}}
function batchExpiryKey(b){return b.openUntil||b.useBy||b.bestBefore||'9999-12-31'}
function removeOne(i){const available=total(i.id);if(available<=0)return alert('Kein Bestand vorhanden.');const n=Number(prompt('Menge entnehmen (verfügbar: '+available+' '+(i.unit||'Stk.')+')','1')||0);if(n<=0)return;if(n>available)return alert('Es sind nur '+available+' '+(i.unit||'Stk.')+' verfügbar.');let left=n;const batches=db.batches.filter(x=>x.itemId===i.id&&Number(x.qty)>0).sort((a,b)=>batchExpiryKey(a).localeCompare(batchExpiryKey(b)));for(const b of batches){if(left<=0)break;const take=Math.min(Number(b.qty),left);b.qty=Number(b.qty)-take;left-=take}db.actions.unshift({at:new Date().toISOString(),type:'Entnehmen',name:i.name+' · '+n+' '+(i.unit||'Stk.')});save();renderStock()}
function renderShopping(){renderShoppingCart()}
function shoppingData(){const active=db.shopping.filter(x=>!x.done),done=db.shopping.filter(x=>x.done),blockedIds=new Set(db.shopping.filter(x=>x.itemId).map(x=>x.itemId)),suggestions=db.items.map(i=>({i,missing:Math.max(0,Number(i.min||0)-total(i.id))})).filter(x=>x.missing>0&&!blockedIds.has(x.i.id));return{active,done,suggestions}}
function shoppingTabs(activeTab){const d=shoppingData();return '<div class="row" style="margin-bottom:8px"><button id="tabCart" class="'+(activeTab==='cart'?'primary':'')+'">🛒 Einkaufswagen ('+d.active.length+')</button><button id="tabLow" class="'+(activeTab==='low'?'primary':'')+'">⚠ Unter Mindestbestand ('+d.suggestions.length+')</button><button id="tabDone" class="'+(activeTab==='done'?'primary':'')+'">✓ Gekauft ('+d.done.length+')</button></div><div class="muted" style="margin-bottom:12px">Gekaufte Lagerartikel verschwinden automatisch, sobald der Mindestbestand durch das Einlagern wieder erreicht ist.</div>'}
function bindShoppingTabs(){if($('#tabCart'))$('#tabCart').onclick=renderShoppingCart;if($('#tabLow'))$('#tabLow').onclick=renderShoppingLow;if($('#tabDone'))$('#tabDone').onclick=renderShoppingDone}
function renderShoppingCart(){title('Einkaufsliste');const{active}=shoppingData();$('#app').innerHTML=shoppingTabs('cart')+'<form id="sf" class="card"><h3 style="margin-top:0">Zum Einkaufswagen hinzufügen</h3><div class="row"><input class="input" name="name" placeholder="Artikel" required><input class="input" name="qty" type="number" min="0.01" step="0.01" value="1" style="max-width:110px"><button class="primary">＋</button></div></form><div class="list">'+(active.length?active.map(x=>{const i=x.itemId?db.items.find(y=>y.id===x.itemId):null;return '<div class="card" style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><div class="muted">'+Number(x.qty||1)+' '+esc(i?i.unit||'Stk.':'')+'</div></div><button class="shopdone" data-id="'+x.id+'" style="flex:0 0 auto;padding:8px 10px;font-size:13px">✓ Gekauft</button><button class="shopdel" data-id="'+x.id+'" style="flex:0 0 auto;padding:8px 10px;font-size:13px">Entfernen</button></div>'}).join(''):'<div class="card muted">Der Einkaufswagen ist leer.</div>')+'</div>';bindShoppingTabs();$('#sf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.shopping.push({id:uid('s'),name:f.get('name').trim(),qty:Number(f.get('qty')||1),done:false});save();renderShoppingCart()};document.querySelectorAll('.shopdone').forEach(b=>b.onclick=()=>{const x=db.shopping.find(y=>y.id===b.dataset.id);if(x)x.done=true;save();renderShoppingCart()});document.querySelectorAll('.shopdel').forEach(b=>b.onclick=()=>{db.shopping=db.shopping.filter(y=>y.id!==b.dataset.id);save();renderShoppingCart()})}
function renderShoppingLow(){title('Unter Mindestbestand');const{suggestions}=shoppingData();$('#app').innerHTML=shoppingTabs('low')+(suggestions.length?'<div class="list">'+suggestions.map(x=>'<div class="card" style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><b>'+esc(x.i.name)+'</b><div class="muted">Bestand: '+total(x.i.id)+' / Minimum: '+Number(x.i.min||0)+' '+esc(x.i.unit||'Stk.')+'</div></div><button class="addsug" data-item="'+x.i.id+'" style="flex:0 0 auto;padding:8px 10px;font-size:13px">＋ '+x.missing+' '+esc(x.i.unit||'Stk.')+'</button></div>').join('')+'</div><button id="addAllMissing" class="primary" style="width:100%;margin-top:10px">Alle fehlenden in Einkaufswagen</button>':'<div class="card muted">Kein Artikel liegt unter dem Mindestbestand.</div>');bindShoppingTabs();document.querySelectorAll('.addsug').forEach(b=>b.onclick=()=>{const i=db.items.find(x=>x.id===b.dataset.item);if(!i)return;const missing=Math.max(0,Number(i.min||0)-total(i.id));if(missing>0)db.shopping.push({id:uid('s'),itemId:i.id,name:i.name,qty:missing,done:false});save();renderShoppingLow()});if($('#addAllMissing'))$('#addAllMissing').onclick=()=>{suggestions.forEach(x=>db.shopping.push({id:uid('s'),itemId:x.i.id,name:x.i.name,qty:x.missing,done:false}));save();renderShoppingLow()}}
function renderShoppingDone(){title('Gekauft');const{done}=shoppingData();$('#app').innerHTML=shoppingTabs('done')+'<div class="list">'+(done.length?done.map(x=>{const i=x.itemId?db.items.find(y=>y.id===x.itemId):null;return '<div class="card" style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><b>✓ '+esc(x.name)+'</b><div class="muted">'+Number(x.qty||1)+' '+esc(i?i.unit||'Stk.':'')+'</div></div><button class="shopdel" data-id="'+x.id+'" style="flex:0 0 auto;padding:8px 10px;font-size:13px">Austragen</button></div>'}).join(''):'<div class="card muted">Noch nichts als gekauft markiert.</div>')+'</div>';bindShoppingTabs();document.querySelectorAll('.shopdel').forEach(b=>b.onclick=()=>{db.shopping=db.shopping.filter(y=>y.id!==b.dataset.id);save();renderShoppingDone()})}
function renderDashboard(){title('Übersicht');const w=warnCounts();const urgent=db.items.map(i=>({i,e:earliest(i.id)})).filter(x=>x.e).sort((a,b)=>(a.e.useBy||a.e.bestBefore).localeCompare(b.e.useBy||b.e.bestBefore)).slice(0,8);$('#app').innerHTML='<div class="grid"><div class="card"><b>'+w.soon+'</b><div class="muted">bald ablaufend</div></div><div class="card"><b>'+w.expired+'</b><div class="muted">abgelaufen</div></div><div class="card"><b>'+w.low+'</b><div class="muted">unter Minimum</div></div><div class="card"><b>'+w.opened+'</b><div class="muted">geöffnet</div></div></div><h3 class="sectionTitle">Als Nächstes verbrauchen</h3><div class="list">'+urgent.map(x=>'<div class="card"><b>'+esc(x.i.name)+'</b><div class="muted">'+esc(x.e.useBy||x.e.bestBefore)+'</div></div>').join('')+'</div>'}
function dateTimeDE(s){if(!s)return '';const d=new Date(s);if(Number.isNaN(d.getTime()))return String(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function actionIcon(t){t=String(t||'').toLowerCase();if(t.includes('einlag'))return '＋';if(t.includes('entnehm'))return '−';if(t.includes('geöffnet'))return '🔓';if(t.includes('inventur'))return '✓';if(t.includes('gelöscht'))return '🗑';if(t.includes('zusammen'))return '⇄';if(t.includes('datum')||t.includes('charge'))return '✎';return '•'}
function renderHistory(){title('Verlauf');const actions=Array.isArray(db.actions)?db.actions:[];$('#app').innerHTML='<div class="card"><input id="historySearch" class="input" placeholder="Verlauf durchsuchen…"><select id="historyType" class="select"><option value="">Alle Vorgänge</option>'+[...new Set(actions.map(a=>a.type).filter(Boolean))].sort().map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join('')+'</select></div><div id="historyList" class="list"></div>'+(actions.length?'<button id="clearHistory" class="danger" style="width:100%;margin-top:10px">Verlauf löschen</button>':'');const draw=()=>{const q=$('#historySearch').value.trim().toLowerCase(),type=$('#historyType').value;const list=actions.filter(a=>(!type||a.type===type)&&(!q||((a.type||'')+' '+(a.name||'')).toLowerCase().includes(q))).slice(0,200);$('#historyList').innerHTML=list.length?list.map(a=>'<div class="card" style="display:flex;align-items:center;gap:10px"><div style="font-size:20px;flex:0 0 auto">'+actionIcon(a.type)+'</div><div style="flex:1;min-width:0"><b>'+esc(a.type||'Vorgang')+'</b><div>'+esc(a.name||'')+'</div><div class="muted">'+dateTimeDE(a.at)+'</div></div></div>').join(''):'<div class="card muted">Keine passenden Einträge vorhanden.</div>'};$('#historySearch').oninput=draw;$('#historyType').onchange=draw;if($('#clearHistory'))$('#clearHistory').onclick=()=>{if(confirm('Den gesamten Verlauf löschen? Die Lagerbestände bleiben unverändert.')){db.actions=[];save();renderHistory()}};draw()}
function renderInventory(){title('Inventur');$('#app').innerHTML='<label>Lagerort<select id="il" class="select">'+optionsLoc()+'</select></label><button class="primary" id="start">Bestände prüfen</button><div id="ilist" class="list" style="margin-top:12px"></div>';$('#start').onclick=()=>{const loc=$('#il').value,ids=[...new Set(db.batches.filter(b=>b.locationId===loc&&b.qty>0).map(b=>b.itemId))];$('#ilist').innerHTML=ids.map(id=>{const i=db.items.find(x=>x.id===id),n=db.batches.filter(b=>b.itemId===id&&b.locationId===loc).reduce((s,b)=>s+b.qty,0);return '<div class="card"><b>'+esc(i.name)+'</b><div class="muted">Gespeichert: '+n+' '+esc(i.unit)+'</div><input class="input inv" data-id="'+id+'" data-loc="'+loc+'" type="number" step="0.01" value="'+n+'"></div>'}).join('')+'<button id="saveInv" class="primary">Inventur speichern</button>';$('#saveInv').onclick=()=>{document.querySelectorAll('.inv').forEach(x=>{const bs=db.batches.filter(b=>b.itemId===x.dataset.id&&b.locationId===x.dataset.loc);const n=Number(x.value);if(bs[0]){bs[0].qty=n;bs.slice(1).forEach(b=>b.qty=0)}});db.actions.unshift({at:new Date().toISOString(),type:'Inventur',name:locName(loc)});save();home()}}}
function renderScan(){title('Scannen');$('#app').innerHTML='<div class="card scanHero"><h2>QR-Code oder Barcode scannen</h2><p class="muted">'+(activeScanLocation?'Aktiver Lagerort: <b>'+esc(locName(activeScanLocation))+'</b>':'Optional zuerst einen Lagerort-Code scannen, danach den Artikel.')+'</p><button id="camera" class="primary">📷 Kamera öffnen</button></div><div class="card"><label>Code manuell eingeben<input id="code" class="input" placeholder="ITEM:… / LOC:… / Barcode"></label><button id="find">Code auswerten</button></div>'+(activeScanLocation?'<button id="clearLoc" class="item">Aktiven Lagerort beenden</button>':'');$('#camera').onclick=()=>{if(window.Android&&Android.scanQr)Android.scanQr();else alert('Kamera-Scanner nicht verfügbar.')};$('#find').onclick=()=>handleQr($('#code').value.trim());if($('#clearLoc'))$('#clearLoc').onclick=()=>{activeScanLocation=null;renderScan()}}
function normalizeBackup(x){if(!x||typeof x!=='object'||Array.isArray(x))throw new Error('Kein gültiges Lagerraum-Backup.');for(const k of ['items','batches','shopping','locations'])if(!Array.isArray(x[k]))throw new Error('Backup ist unvollständig: '+k+' fehlt.');const n={...structuredClone(defaults),...x};n.settings={...structuredClone(defaults.settings),...(x.settings&&typeof x.settings==='object'?x.settings:{})};n.actions=Array.isArray(x.actions)?x.actions:[];return n}
function backupSummary(x){return x.items.length+' Artikel\n'+x.batches.length+' Chargen\n'+x.locations.length+' Lagerorte\n'+x.shopping.filter(s=>!s.done).length+' Einträge im Einkaufswagen\n'+x.shopping.filter(s=>s.done).length+' gekaufte Einträge'}
function exportBackup(){const d=new Date(),stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),name='lagerraum-backup-'+stamp+'.json',json=JSON.stringify(db,null,2);if(window.Android&&Android.saveBackup){Android.saveBackup(name,json);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderSettings(){title('Einstellungen');const s=db.settings||(db.settings={});if(s.notificationsEnabled==null)s.notificationsEnabled=false;if(!s.notificationTime)s.notificationTime='09:00';$('#app').innerHTML='<div class="card"><label>MHD-Vorwarnung in Tagen<input id="wd" class="input" type="number" min="0" value="'+s.warnDays+'"></label></div><div class="card"><h3 style="margin-top:0">Benachrichtigungen</h3><label style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><input id="notifyEnabled" type="checkbox" '+(s.notificationsEnabled?'checked':'')+'> Benachrichtigungen aktiv</label><label>Benachrichtigungszeit<input id="notifyTime" class="input" type="time" value="'+esc(s.notificationTime)+'"></label><div class="muted">Es wird nur benachrichtigt, wenn Artikel abgelaufen, bald fällig oder unter Mindestbestand sind.</div><button id="testNotify" style="width:100%;margin-top:10px">Testbenachrichtigung senden</button></div><button class="item" id="locs">Lagerorte verwalten</button><div class="card"><h3 style="margin-top:0">Backup & Wiederherstellung</h3><div class="muted" style="margin-bottom:10px">Aktuell: '+db.items.length+' Artikel · '+db.batches.length+' Chargen · '+db.locations.length+' Lagerorte</div><button id="backup" style="width:100%">Backup exportieren</button><label style="display:block;margin-top:10px">Backup importieren<input id="restore" class="input" type="file" accept="application/json,.json"></label><div class="muted">Vor dem Import wird der Inhalt geprüft und zusammengefasst. Deine aktuellen Daten werden erst nach Bestätigung ersetzt.</div></div><button id="wipe" class="danger">Alle Daten löschen</button>';$('#wd').onchange=e=>{s.warnDays=Number(e.target.value);save()};$('#notifyEnabled').onchange=e=>{s.notificationsEnabled=e.target.checked;save()};$('#notifyTime').onchange=e=>{s.notificationTime=e.target.value||'09:00';save()};$('#testNotify').onclick=()=>{if(window.Android&&Android.testNotification)Android.testNotification(JSON.stringify(db));else alert('Benachrichtigungen sind auf diesem Gerät nicht verfügbar.')};$('#locs').onclick=()=>go('locations');$('#backup').onclick=exportBackup;$('#restore').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const imported=normalizeBackup(JSON.parse(r.result));const summary=backupSummary(imported);if(!confirm('Dieses Backup wurde geprüft und enthält:\n\n'+summary+'\n\nDie aktuell gespeicherten Daten werden vollständig ersetzt. Backup wirklich importieren?')){e.target.value='';return}db=imported;save();alert('Backup erfolgreich wiederhergestellt.');home()}catch(err){alert('Backup konnte nicht importiert werden.\n\n'+(err&&err.message?err.message:'Ungültige Datei.'));e.target.value=''}};r.onerror=()=>{alert('Die Datei konnte nicht gelesen werden.');e.target.value=''};r.readAsText(file)};$('#wipe').onclick=()=>{if(confirm('Alle Daten löschen?')){db=structuredClone(defaults);save();home()}}}
function renderLocations(){title('Lagerorte');$('#app').innerHTML='<div class="list">'+db.locations.map(l=>'<div class="card"><b>'+esc(locName(l.id))+'</b><div class="muted">'+(l.scanCode?'Eigener Lager-Code ist zugeordnet.':'Noch kein eigener Lager-Code zugeordnet.')+'</div><button class="locqr" data-locqr="'+l.id+'" style="width:100%;margin-top:8px">▣ Lager-QR anzeigen</button><button class="assignloc" data-assignloc="'+l.id+'" style="width:100%;margin-top:8px">📷 QR-/Barcode zuordnen</button>'+(l.scanCode?'<button class="clearcode" data-clearcode="'+l.id+'" style="width:100%;margin-top:8px">Zuordnung löschen</button>':'')+'</div>').join('')+'</div><form id="lf" class="card"><h3>Neuer Lagerort</h3><input class="input" name="name" required placeholder="Name"><select class="select" name="parent"><option value="">Oberste Ebene</option>'+optionsLoc()+'</select><button class="primary">Hinzufügen</button></form>';document.querySelectorAll('[data-locqr]').forEach(b=>b.onclick=()=>{const l=db.locations.find(x=>x.id===b.dataset.locqr);openQr('LOC',l.id,locName(l.id))});document.querySelectorAll('[data-assignloc]').forEach(b=>b.onclick=()=>{assignLocationId=b.dataset.assignloc;if(window.Android&&Android.scanQr)Android.scanQr();else alert('Kamera-Scanner nicht verfügbar.')});document.querySelectorAll('[data-clearcode]').forEach(b=>b.onclick=()=>{const l=db.locations.find(x=>x.id===b.dataset.clearcode);if(l){delete l.scanCode;save();renderLocations()}});$('#lf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.locations.push({id:uid('loc'),name:f.get('name').trim(),parent:f.get('parent')||null});save();renderLocations()}}
function openQr(kind,id,name){navigate('qr',{qr:{kind,id,name}})}
function renderQr(){const q=currentQrData;if(!q){back();return;}title('QR-Code');const kind=q.kind,id=q.id,name=q.name,payload=kind+':'+id;let src='';if(window.Android&&Android.generateQr)src=Android.generateQr(payload);$('#app').innerHTML='<div class="card qrbox"><h2>'+esc(name)+'</h2>'+(src?'<img src="'+src+'" alt="QR-Code">':'<p>QR-Erzeugung nicht verfügbar.</p>')+'<p class="muted">'+esc(payload)+'</p><p class="muted">Diesen QR-Code kannst du ausdrucken oder von einem zweiten Bildschirm scannen.</p></div>'}
function handleQr(code){if(!code)return;if(assignLocationId){const l=db.locations.find(x=>x.id===assignLocationId);assignLocationId=null;if(l){l.scanCode=code;save();alert('Code wurde dem Lagerort „'+locName(l.id)+'“ zugeordnet.');renderLocations();return}}let i=null,l=null;if(code.startsWith('ITEM:'))i=db.items.find(x=>x.id===code.slice(5));else if(code.startsWith('LOC:'))l=db.locations.find(x=>x.id===code.slice(4));else{l=db.locations.find(x=>x.scanCode===code);if(!l)i=db.items.find(x=>x.qr===code)}if(l){activeScanLocation=l.id;renderScan();return}if(i){openItem(i.id);return}if(confirm('Dieser Code ist noch unbekannt. Soll damit ein neuer Artikel angelegt werden?')){pendingQr=code;go('add')}}
window.onNativeQrScanned=code=>handleQr(code);
window.onNativeQrError=message=>alert(message||'QR-Scanner konnte nicht gestartet werden.');
window.onNativeBackupResult=(success,message)=>{if(success)alert(message||'Backup wurde erfolgreich gespeichert.');else if(message&&message!=='Speichern wurde abgebrochen.')alert(message)};
syncNotifications();
render();
</script>
