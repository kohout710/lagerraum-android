<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lagerraum</title>
<style>
:root{--bg:#0f1410;--card:#182019;--card2:#202a21;--line:#344136;--text:#f4f7f4;--muted:#aab5ac;--accent:#8eb47f;--warn:#e8b85f;--bad:#e17878}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:18px 14px 14px;background:#0f1410f2;border-bottom:1px solid var(--line);z-index:4}
header h1{font-size:20px;margin:0;flex:1}button,input,select,textarea{font:inherit}
button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:13px;padding:12px}
main{padding:14px;max-width:760px;margin:auto}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{text-align:left;min-height:110px}.tile.big{grid-column:1/-1;background:#223126}.tile b{display:block;font-size:18px;margin-top:8px}.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}.input,.select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;margin:5px 0 10px}
.primary{background:var(--accent);color:#102012;font-weight:800}.danger{background:#432326}.list{display:grid;gap:9px}.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2b352c;color:var(--muted);font-size:12px;margin:4px 4px 0 0}.warn{background:#4a3a1b;color:#ffd987}.bad{background:#462225;color:#ffb1b1}
.hidden{display:none}.topbtn{width:44px;height:44px;padding:0}.sectionTitle{font-size:17px;margin:18px 0 9px}.qrbox{text-align:center}.qrbox img{width:min(72vw,320px);background:white;padding:12px;border-radius:16px}.scanHero{padding:18px;text-align:center}.scanHero button{width:100%;font-size:18px;padding:18px}
</style>
</head>
<body>
<header><button id="back" class="topbtn hidden">←</button><button id="home" class="topbtn hidden">⌂</button><h1 id="title">Lagerraum</h1><button id="settings" class="topbtn">⚙</button></header>
<main id="app"></main>
<script>
const KEY='lagerraum01';
const defaults={items:[],batches:[],shopping:[],locations:[{id:'home',name:'Haus',parent:null},{id:'kitchen',name:'Küche',parent:'home'},{id:'fridge',name:'Kühlschrank',parent:'kitchen'},{id:'cellar',name:'Keller',parent:'home'}],actions:[],settings:{warnDays:3}};
let db=load(),route='home',stack=[],pendingQr='',activeScanLocation=null,assignLocationId=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function go(r){if(route!==r)stack.push(route);route=r;render()}
function home(){stack=[];route='home';render()}
function back(){route=stack.pop()||'home';render()}
function title(t){$('#title').textContent=t;$('#back').classList.toggle('hidden',route==='home');$('#home').classList.toggle('hidden',route==='home')}
$('#back').onclick=back;$('#home').onclick=home;$('#settings').onclick=()=>go('settings');
function total(id){return db.batches.filter(b=>b.itemId===id).reduce((n,b)=>n+Number(b.qty||0),0)}
function locName(id){let l=db.locations.find(x=>x.id===id);if(!l)return 'Ohne Lagerort';let a=[l.name];while(l.parent){l=db.locations.find(x=>x.id===l.parent);if(!l)break;a.unshift(l.name)}return a.join(' › ')}
function dayDiff(d){if(!d)return 9999;return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}
function earliest(id){return db.batches.filter(b=>b.itemId===id&&b.qty>0&&(b.useBy||b.bestBefore||b.openUntil)).sort((a,b)=>(a.openUntil||a.useBy||a.bestBefore).localeCompare(b.openUntil||b.useBy||b.bestBefore))[0]}
function warnCounts(){let soon=0,expired=0,low=0,opened=0;for(const i of db.items){const e=earliest(i.id),d=e?dayDiff(e.openUntil||e.useBy||e.bestBefore):9999;if(d<0)expired++;else if(d<=db.settings.warnDays)soon++;if(total(i.id)<Number(i.min||0))low++;if(db.batches.some(b=>b.itemId===i.id&&b.opened&&b.qty>0))opened++}return{soon,expired,low,opened}}
function itemHtml(i){const e=earliest(i.id),d=e?dayDiff(e.openUntil||e.useBy||e.bestBefore):9999;return '<button class="item" data-item="'+i.id+'"><b>'+esc(i.name)+'</b><div class="muted">'+total(i.id)+' '+esc(i.unit||'Stk.')+' · '+esc(i.category||'Ohne Kategorie')+'</div>'+(d<0?'<span class="badge bad">abgelaufen</span>':d<=db.settings.warnDays?'<span class="badge warn">bald fällig</span>':'')+(total(i.id)<Number(i.min||0)?'<span class="badge warn">Mindestbestand</span>':'')+'</button>'}
function render(){({home:renderHome,stock:renderStock,add:renderAdd,shopping:renderShopping,dashboard:renderDashboard,inventory:renderInventory,scan:renderScan,settings:renderSettings,locations:renderLocations}[route]||renderHome)()}
function renderHome(){title('Lagerraum');const w=warnCounts();$('#app').innerHTML='<div class="hero"><h2 style="margin:0">Vorrat im Blick</h2><div class="muted">'+db.items.length+' Artikel gespeichert</div><div class="row" style="margin-top:12px"><div class="card" style="margin:0;text-align:center"><b>'+w.soon+'</b><div class="muted">bald ablaufend</div></div><div class="card" style="margin:0;text-align:center"><b>'+w.low+'</b><div class="muted">Mindestbestand</div></div></div></div><div class="grid"><button class="tile" data-go="stock">🧺<b>Lager</b><span class="muted">Bestände & Chargen</span></button><button class="tile" data-go="add">＋<b>Hinzufügen</b><span class="muted">Artikel einlagern</span></button><button class="tile" data-go="shopping">🛒<b>Einkaufsliste</b><span class="muted">Einkäufe planen</span></button><button class="tile" data-go="dashboard">📊<b>Übersicht</b><span class="muted">Warnungen</span></button><button class="tile big" data-go="scan">▣<b>Scannen</b><span class="muted">QR-Code eingeben oder zuordnen</span></button></div><div class="row" style="margin-top:10px"><button data-go="inventory">✓ Inventur</button><button data-go="settings">⚙ Einstellungen</button></div>';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function renderStock(){title('Lager');$('#app').innerHTML='<input id="q" class="input" placeholder="Suchen…"><div id="list" class="list"></div>';const draw=()=>{const q=$('#q').value.toLowerCase();const a=db.items.filter(i=>(i.name+' '+(i.brand||'')+' '+(i.category||'')).toLowerCase().includes(q));$('#list').innerHTML=a.map(itemHtml).join('')||'<div class="card muted">Noch keine Artikel vorhanden.</div>';document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>showItem(b.dataset.item))};$('#q').oninput=draw;draw()}
function showItem(id){const i=db.items.find(x=>x.id===id),bs=db.batches.filter(b=>b.itemId===id&&b.qty>0);$('#app').innerHTML='<div class="card"><h2>'+esc(i.name)+'</h2><div class="muted">'+esc(i.brand||'')+' · '+esc(i.category||'')+'</div><p>Gesamtbestand: <b>'+total(id)+' '+esc(i.unit||'Stk.')+'</b></p><div class="row"><button class="primary" id="in">＋ Einlagern</button><button id="out">− Entnehmen</button></div><button id="showqr" style="width:100%;margin-top:8px">▣ QR-Code anzeigen</button></div><h3 class="sectionTitle">Chargen</h3><div class="list">'+bs.map(b=>'<div class="card"><b>'+b.qty+' '+esc(i.unit||'Stk.')+'</b><div class="muted">'+esc(locName(b.locationId))+'</div><div class="muted">'+(b.useBy?'Verbrauch: '+b.useBy:b.bestBefore?'MHD: '+b.bestBefore:'Ohne Datum')+'</div></div>').join('')+'</div>';$('#in').onclick=()=>batchForm(i);$('#out').onclick=()=>removeOne(i);$('#showqr').onclick=()=>showQr('ITEM',i.id,i.name)}
function optionsLoc(selected){return db.locations.map(l=>'<option value="'+l.id+'"'+(l.id===selected?' selected':'')+'>'+esc(locName(l.id))+'</option>').join('')}
function renderAdd(){title('Hinzufügen');$('#app').innerHTML='<form id="f" class="card"><label>Name<input class="input" name="name" required></label><label>Marke<input class="input" name="brand"></label><label>Kategorie<input class="input" name="cat"></label><div class="row"><label>Einheit<select class="select" name="unit"><option>Stk.</option><option>Packung</option><option>Dose</option><option>Glas</option><option>g</option><option>kg</option><option>ml</option><option>l</option></select></label><label>Mindestbestand<input class="input" name="min" type="number" min="0" value="0"></label></div><label>Externer QR-Code (optional)<input class="input" name="qr" value="'+esc(pendingQr)+'"></label><button class="primary" style="width:100%">Artikel speichern</button></form>';$('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),i={id:uid('item'),name:f.get('name').trim(),brand:f.get('brand').trim(),category:f.get('cat').trim(),unit:f.get('unit'),min:Number(f.get('min')||0),qr:f.get('qr').trim()};pendingQr='';db.items.push(i);save();batchForm(i)}}
function batchForm(i){title('Einlagern');$('#app').innerHTML='<div class="card"><h2>'+esc(i.name)+'</h2><form id="bf"><label>Menge<input class="input" name="qty" type="number" min="0.01" step="0.01" value="1" required></label><label>Lagerort<select class="select" name="loc">'+optionsLoc(activeScanLocation)+'</select></label><label>MHD<input class="input" name="mhd" type="date"></label><label>Verbrauchsdatum<input class="input" name="use" type="date"></label><label><input type="checkbox" name="opened"> bereits geöffnet</label><button class="primary" style="width:100%;margin-top:12px">Einlagern</button></form></div>';$('#bf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.batches.push({id:uid('batch'),itemId:i.id,qty:Number(f.get('qty')),locationId:f.get('loc'),bestBefore:f.get('mhd'),useBy:f.get('use'),opened:f.get('opened')==='on'});db.actions.unshift({at:new Date().toISOString(),type:'Einlagern',name:i.name});save();home()}}
function removeOne(i){const b=db.batches.filter(x=>x.itemId===i.id&&x.qty>0).sort((a,b)=>(a.useBy||a.bestBefore||'9999').localeCompare(b.useBy||b.bestBefore||'9999'))[0];if(!b)return alert('Kein Bestand vorhanden.');const n=Number(prompt('Menge entnehmen','1')||0);if(n<=0)return;b.qty=Math.max(0,b.qty-n);db.actions.unshift({at:new Date().toISOString(),type:'Entnehmen',name:i.name});save();renderStock()}
function renderShopping(){title('Einkaufsliste');$('#app').innerHTML='<form id="sf" class="row"><input class="input" name="name" placeholder="Artikel" required><button class="primary">＋</button></form><div class="list">'+db.shopping.filter(x=>!x.done).map(x=>'<button class="item" data-shop="'+x.id+'">☐ '+esc(x.name)+'</button>').join('')+'</div>';$('#sf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.shopping.push({id:uid('s'),name:f.get('name').trim(),done:false});save();renderShopping()};document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{db.shopping.find(x=>x.id===b.dataset.shop).done=true;save();renderShopping()})}
function renderDashboard(){title('Übersicht');const w=warnCounts();const urgent=db.items.map(i=>({i,e:earliest(i.id)})).filter(x=>x.e).sort((a,b)=>(a.e.useBy||a.e.bestBefore).localeCompare(b.e.useBy||b.e.bestBefore)).slice(0,8);$('#app').innerHTML='<div class="grid"><div class="card"><b>'+w.soon+'</b><div class="muted">bald ablaufend</div></div><div class="card"><b>'+w.expired+'</b><div class="muted">abgelaufen</div></div><div class="card"><b>'+w.low+'</b><div class="muted">unter Minimum</div></div><div class="card"><b>'+w.opened+'</b><div class="muted">geöffnet</div></div></div><h3 class="sectionTitle">Als Nächstes verbrauchen</h3><div class="list">'+urgent.map(x=>'<div class="card"><b>'+esc(x.i.name)+'</b><div class="muted">'+esc(x.e.useBy||x.e.bestBefore)+'</div></div>').join('')+'</div>'}
function renderInventory(){title('Inventur');$('#app').innerHTML='<label>Lagerort<select id="il" class="select">'+optionsLoc()+'</select></label><button class="primary" id="start">Bestände prüfen</button><div id="ilist" class="list" style="margin-top:12px"></div>';$('#start').onclick=()=>{const loc=$('#il').value,ids=[...new Set(db.batches.filter(b=>b.locationId===loc&&b.qty>0).map(b=>b.itemId))];$('#ilist').innerHTML=ids.map(id=>{const i=db.items.find(x=>x.id===id),n=db.batches.filter(b=>b.itemId===id&&b.locationId===loc).reduce((s,b)=>s+b.qty,0);return '<div class="card"><b>'+esc(i.name)+'</b><div class="muted">Gespeichert: '+n+' '+esc(i.unit)+'</div><input class="input inv" data-id="'+id+'" data-loc="'+loc+'" type="number" step="0.01" value="'+n+'"></div>'}).join('')+'<button id="saveInv" class="primary">Inventur speichern</button>';$('#saveInv').onclick=()=>{document.querySelectorAll('.inv').forEach(x=>{const bs=db.batches.filter(b=>b.itemId===x.dataset.id&&b.locationId===x.dataset.loc);const n=Number(x.value);if(bs[0]){bs[0].qty=n;bs.slice(1).forEach(b=>b.qty=0)}});db.actions.unshift({at:new Date().toISOString(),type:'Inventur',name:locName(loc)});save();home()}}}
function renderScan(){title('Scannen');$('#app').innerHTML='<div class="card scanHero"><h2>QR-Code oder Barcode scannen</h2><p class="muted">'+(activeScanLocation?'Aktiver Lagerort: <b>'+esc(locName(activeScanLocation))+'</b>':'Optional zuerst einen Lagerort-Code scannen, danach den Artikel.')+'</p><button id="camera" class="primary">📷 Kamera öffnen</button></div><div class="card"><label>Code manuell eingeben<input id="code" class="input" placeholder="ITEM:… / LOC:… / Barcode"></label><button id="find">Code auswerten</button></div>'+(activeScanLocation?'<button id="clearLoc" class="item">Aktiven Lagerort beenden</button>':'');$('#camera').onclick=()=>{if(window.Android&&Android.scanQr)Android.scanQr();else alert('Kamera-Scanner nicht verfügbar.')};$('#find').onclick=()=>handleQr($('#code').value.trim());if($('#clearLoc'))$('#clearLoc').onclick=()=>{activeScanLocation=null;renderScan()}}
function renderSettings(){title('Einstellungen');$('#app').innerHTML='<div class="card"><label>MHD-Vorwarnung in Tagen<input id="wd" class="input" type="number" min="0" value="'+db.settings.warnDays+'"></label></div><button class="item" id="locs">Lagerorte verwalten</button><div class="card"><button id="backup">Backup exportieren</button><label style="display:block;margin-top:10px">Backup importieren<input id="restore" class="input" type="file" accept="application/json"></label></div><button id="wipe" class="danger">Alle Daten löschen</button>';$('#wd').onchange=e=>{db.settings.warnDays=Number(e.target.value);save()};$('#locs').onclick=()=>go('locations');$('#backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='lagerraum-backup.json';a.click()};$('#restore').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();home()}catch(e){alert('Ungültige Datei')}};r.readAsText(f)};$('#wipe').onclick=()=>{if(confirm('Alle Daten löschen?')){db=structuredClone(defaults);save();home()}}}
function renderLocations(){title('Lagerorte');$('#app').innerHTML='<div class="list">'+db.locations.map(l=>'<div class="card"><b>'+esc(locName(l.id))+'</b><div class="muted">'+(l.scanCode?'Eigener Lager-Code ist zugeordnet.':'Noch kein eigener Lager-Code zugeordnet.')+'</div><button class="locqr" data-locqr="'+l.id+'" style="width:100%;margin-top:8px">▣ Lager-QR anzeigen</button><button class="assignloc" data-assignloc="'+l.id+'" style="width:100%;margin-top:8px">📷 QR-/Barcode zuordnen</button>'+(l.scanCode?'<button class="clearcode" data-clearcode="'+l.id+'" style="width:100%;margin-top:8px">Zuordnung löschen</button>':'')+'</div>').join('')+'</div><form id="lf" class="card"><h3>Neuer Lagerort</h3><input class="input" name="name" required placeholder="Name"><select class="select" name="parent"><option value="">Oberste Ebene</option>'+optionsLoc()+'</select><button class="primary">Hinzufügen</button></form>';document.querySelectorAll('[data-locqr]').forEach(b=>b.onclick=()=>{const l=db.locations.find(x=>x.id===b.dataset.locqr);showQr('LOC',l.id,locName(l.id))});document.querySelectorAll('[data-assignloc]').forEach(b=>b.onclick=()=>{assignLocationId=b.dataset.assignloc;if(window.Android&&Android.scanQr)Android.scanQr();else alert('Kamera-Scanner nicht verfügbar.')});document.querySelectorAll('[data-clearcode]').forEach(b=>b.onclick=()=>{const l=db.locations.find(x=>x.id===b.dataset.clearcode);if(l){delete l.scanCode;save();renderLocations()}});$('#lf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.locations.push({id:uid('loc'),name:f.get('name').trim(),parent:f.get('parent')||null});save();renderLocations()}}
function showQr(kind,id,name){title('QR-Code');const payload=kind+':'+id;let src='';if(window.Android&&Android.generateQr)src=Android.generateQr(payload);$('#app').innerHTML='<div class="card qrbox"><h2>'+esc(name)+'</h2>'+(src?'<img src="'+src+'" alt="QR-Code">':'<p>QR-Erzeugung nicht verfügbar.</p>')+'<p class="muted">'+esc(payload)+'</p><p class="muted">Diesen QR-Code kannst du ausdrucken oder von einem zweiten Bildschirm scannen.</p></div>'}
function handleQr(code){if(!code)return;if(assignLocationId){const l=db.locations.find(x=>x.id===assignLocationId);assignLocationId=null;if(l){l.scanCode=code;save();alert('Code wurde dem Lagerort „'+locName(l.id)+'“ zugeordnet.');renderLocations();return}}let i=null,l=null;if(code.startsWith('ITEM:'))i=db.items.find(x=>x.id===code.slice(5));else if(code.startsWith('LOC:'))l=db.locations.find(x=>x.id===code.slice(4));else{l=db.locations.find(x=>x.scanCode===code);if(!l)i=db.items.find(x=>x.qr===code)}if(l){activeScanLocation=l.id;renderScan();return}if(i){showItem(i.id);return}if(confirm('Dieser Code ist noch unbekannt. Soll damit ein neuer Artikel angelegt werden?')){pendingQr=code;go('add')}}
window.onNativeQrScanned=code=>handleQr(code);
window.onNativeQrError=message=>alert(message||'QR-Scanner konnte nicht gestartet werden.');
render();
</script>
</body>
</html>
