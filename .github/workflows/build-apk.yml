name: Build Lagerraum APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LAGERRAUM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lagerraum-release.jks"
      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.LAGERRAUM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAGERRAUM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAGERRAUM_KEY_PASSWORD }}
        run: |
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner sign             --ks "$RUNNER_TEMP/lagerraum-release.jks"             --ks-pass "pass:$STORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out app/build/outputs/apk/release/Lagerraum-0.2.21-signed.apk             app/build/outputs/apk/release/app-release-unsigned.apk
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/Lagerraum-0.2.21-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lagerraum-0.2.21-signed-apk
          path: app/build/outputs/apk/release/Lagerraum-0.2.21-signed.apk
